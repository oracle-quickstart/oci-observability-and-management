title: "Oracle Functions Quick Start"
stackDescription: "This is a OCI (Oracle Cloud Infrastructure) Functions quickstart automation."

schemaVersion: 1.1.0
version: "20190304"

locale: "en"

variableGroups:
  - title: General Configuration
    visible: false
    variables:
      - tenancy_ocid
      - compartment_ocid
      - region

  - title: Required Configuration
    visible: true
    variables:
      - function_image
      - function_name

  - title: Optional Naming
    visible: true
    variables:
      - application_name
      - resource_name_prefix

  - title: Optional Capacity
    visible: true
    variables:
      - function_memory_in_mbs
      - function_timeout_in_seconds

  - title: Optional Network
    visible: true
    variables:
      - vcn_cidr
      - public_subnet_cidr

variables:
  function_image:
    title: "Function Image"
    description: "Full OCIR image URI used by oci_functions_function.image"
    required: true

  application_name:
    title: "Functions Application Name"
    description: "Display name for oci_functions_application"
    required: false
    default: "functions-app"

  function_name:
    title: "Function Name"
    description: "Display name for oci_functions_function"
    required: true

  resource_name_prefix:
    title: "Resource Name Prefix"
    description: "Prefix for network resource display names"
    required: false
    default: "tf-fn"

  function_memory_in_mbs:
    title: "Function Memory (MB)"
    description: "Memory allocation for the function"
    required: false
    default: 256

  function_timeout_in_seconds:
    title: "Function Timeout (Seconds)"
    description: "Execution timeout for the function"
    required: false
    default: 30

  vcn_cidr:
    title: "VCN CIDR"
    description: "CIDR block for the VCN"
    required: false
    default: "10.20.0.0/16"

  public_subnet_cidr:
    title: "Public Subnet CIDR"
    description: "CIDR block for the public subnet"
    required: false
    default: "10.20.1.0/24"

outputGroups:
  - title: Created Functions Resources
    outputs:
      - ${functions_application_id}
      - ${function_id}
      - ${function_invoke_endpoint}
